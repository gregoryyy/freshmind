<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f0;color:#263e33}header,main{max-width:1440px;margin:auto;padding:16px}h1{font-size:22px;margin:0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:5px 14px;cursor:pointer}button:disabled{cursor:default}figure{margin:0 0 30px}figure[hidden]{display:none}img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border:1px solid #c4cdbf}h2{font-size:18px}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #6cb08b;outline-offset:3px}</style></head>
<body><header><h1>Freshmind 4 walkthrough</h1><nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next" type="button">Next</button><a href="README.md">Markdown walkthrough</a></nav></header><main>
<figure id="browser"><h2>1. Graph browser with RFC on the center node</h2><img src="01-browser.png" width="1440" height="1000" alt="Graph browser with RFC on the center node"><figcaption><p>The graph-browser example opens with Reinforcement Focus+Context active on its central Graph browsers node. Yellow halos identify the reinforced center and its five immediate branches; the surrounding graph retains its ordinary connections and forces.</p></figcaption></figure>
<figure id="neighborhood"><h2>2. Reveal the complete graph</h2><img src="02-neighborhood.png" width="1440" height="1000" alt="Reveal the complete graph"><figcaption><p>Show whole graph reveals stored nodes beyond the current neighborhood. Expansion, collapse and hiding change the visible graph while retaining the complete graph for editing and export.</p></figcaption></figure>
<figure id="view-controls"><h2>3. Graph spacing, canvas zoom and viewing lens</h2><img src="03-view-controls.png" width="1440" height="1000" alt="Graph spacing, canvas zoom and viewing lens"><figcaption><p>Graph spacing changes node distances. Canvas zoom scales shapes, labels and strokes together. The focus + context slider applies the independent nonlinear viewing lens.</p></figcaption></figure>
<figure id="key-map"><h2>4. User key map</h2><img src="04-key-map.png" width="1440" height="1000" alt="User key map"><figcaption><p>The help dialog and docs/KEYMAP.md share the same implemented command definitions, including graph spacing, canvas zoom, navigation, editing and file shortcuts.</p></figcaption></figure>
<figure id="types"><h2>5. Node types and curved relations</h2><img src="05-types.png" width="1440" height="1000" alt="Node types and curved relations"><figcaption><p>The palette page shows all 21 configured Freshmind node types, labeled curved relations, parallel edges and a self-loop. Its YAML editor applies semantic and visual configuration to the existing graph.</p></figcaption></figure>
<figure id="berry"><h2>6. Open the approved Berry example</h2><img src="06-berry.png" width="1440" height="1000" alt="Open the approved Berry example"><figcaption><p>Berry is one of the two approved migrated datasets. The native YAML graph retains 21 nodes and 22 relations, annotations and original linked-resource paths.</p></figcaption></figure>
<figure id="public-network"><h2>7. Florentine families</h2><img src="07-public-network.png" width="1440" height="1000" alt="Florentine families"><figcaption><p>This public example has 15 families and 20 undirected marriage links. Node content contains graph-derived summaries and links to the connected families, with source attribution retained in the document.</p></figcaption></figure>
<figure id="inline-edit"><h2>8. Edit a multiline node label</h2><img src="08-inline-edit.png" width="1440" height="1000" alt="Edit a multiline node label"><figcaption><p>F2 opens an inline label editor on the selected node. A draft stays separate from the model until committed; node identity, relations and annotations are retained.</p></figcaption></figure>
<figure id="annotation"><h2>9. Annotations and item details</h2><img src="09-annotation.png" width="1440" height="1000" alt="Annotations and item details"><figcaption><p>Ctrl+Enter commits the label. Space or Show details opens the selected node&#39;s content in a separate, resizable popup. Internal links navigate to connected nodes; Edit content opens the annotation overlay.</p></figcaption></figure>
<figure id="save-yaml"><h2>10. Save the complete graph as YAML</h2><img src="10-save-yaml.png" width="1440" height="1000" alt="Save the complete graph as YAML"><figcaption><p>Ctrl+Shift+S opens the filename dialog. Saving downloads the complete stored graph, including hidden nodes, with optional layout/view state and embedded or companion type configuration.</p></figcaption></figure>
<figure id="rfc-baseline"><h2>11. Single-focus comparison: ordinary layout</h2><img src="11-rfc-baseline.png" width="1440" height="1000" alt="Single-focus comparison: ordinary layout"><figcaption><p>The synthetic crowded-star fixture uses a fixed center and fixed context anchors. This is the ordinary TouchGraph layout after 250 batches from the saved initial coordinates; RFC is off. Adaptive damping is off throughout the fixed-force comparison. Both comparison views use 200% graph spacing and 100% canvas zoom for readability.</p></figcaption></figure>
<figure id="rfc-attraction"><h2>12. Single-focus comparison: attraction reinforcement</h2><img src="12-rfc-attraction.png" width="1440" height="1000" alt="Single-focus comparison: attraction reinforcement"><figcaption><p>Reload the identical graph, choose Attraction only and run 250 batches. This earlier preset combines attraction multiplier 3 with angular stiffness 300, without a target-length spring. Soft yellow halos identify the reinforced nodes and relations; semantic graph records remain unchanged.</p></figcaption></figure>
<figure id="rfc"><h2>13. Single-focus comparison: length-constrained tree</h2><img src="13-rfc.png" width="1440" height="1000" alt="Single-focus comparison: length-constrained tree"><figcaption><p>The default Tree structure preset combines target focal length 120, radial stiffness 1 and angular stiffness 10000. From the same starting graph and after 250 batches, the focal star is more regular. Both stronger angular constraints and the new length spring contribute. Yellow halos show reinforcement; optional focal-region exclusion is demonstrated separately below.</p></figcaption></figure>
<figure id="rfc-weighted"><h2>14. Weighted RFC for horizontally extended labels</h2><img src="14-rfc-weighted.png" width="1440" height="1000" alt="Weighted RFC for horizontally extended labels"><figcaption><p>The wide-label fixture uses horizontal coordinate weight 0.25 and vertical weight 1. Equal angles are measured in weighted physical coordinates, permitting a wider focal layout while the viewing lens and both zooms stay independent. Ordinary context springs still compete with reinforcement; the metric alone does not guarantee clear space or eliminate label overlaps.</p></figcaption></figure>
<figure id="multiple-foci"><h2>15. Reinforce multiple stored trees</h2><img src="15-multiple-foci.png" width="1440" height="1000" alt="Reinforce multiple stored trees"><figcaption><p>Two saved tree definitions reinforce deeper neighborhoods at the same time. Their context relations remain ordinary graph edges. Stored membership survives YAML export; active RFC centers are temporary view state. Shift+Enter can also add or remove an individual center.</p></figcaption></figure>
<figure id="clusters"><h2>16. Overlapping clusters and their boundaries</h2><img src="16-clusters.png" width="1440" height="1000" alt="Overlapping clusters and their boundaries"><figcaption><p>RFC can reinforce cyclic clusters as well as trees. These two stored clusters share a member, retain their internal relations and show translucent boundaries. Cluster rigidity controls resistance to deformation; the representative selects the group without becoming a physical anchor.</p></figcaption></figure>
<figure id="focal-regions"><h2>17. Optional focal-region exclusion</h2><img src="17-focal-regions.png" width="1440" height="1000" alt="Optional focal-region exclusion"><figcaption><p>Dashed physical regions show the space reserved around two reinforced structures. Optional exclusion pushes context and non-shared focal nodes away from those regions while shared members remain exempt from their own regions. The forces are soft; pinned nodes and labels can still overlap.</p></figcaption></figure>
<figure id="importance"><h2>18. Node importance and exact weight values</h2><img src="18-importance.png" width="1440" height="1000" alt="Node importance and exact weight values"><figcaption><p>Node weight scales body and label size within configured limits. Weight 1 keeps normal size and weight 0 remains visible. Optional values make weights explicit when labels differ in length. Size shows importance; yellow halos independently show RFC participation.</p></figcaption></figure>
<figure id="structural-view"><h2>19. Combine RFC with structural aggregation</h2><img src="19-structural-view.png" width="1440" height="1000" alt="Combine RFC with structural aggregation"><figcaption><p>The structural focus + context example combines a viewing lens, RFC and reversible Person/Paper leaf aggregation. Six of thirteen nodes remain visible, with seven aggregated leaves counted under their parents. The shared collaborator stays visible because it connects two semantic neighbors. The complete graph remains intact.</p></figcaption></figure>
<figure id="reveal-detail"><h2>20. Reveal aggregated detail without losing context</h2><img src="20-reveal-detail.png" width="1440" height="1000" alt="Reveal aggregated detail without losing context"><figcaption><p>Select Group Beta and reveal its leaves to restore detail while retaining the current graph, focal center and lens. Nine nodes are now visible. E also reveals a selected parent&#39;s leaves; Reset structural view restores the current neighborhood without deleting semantic data.</p></figcaption></figure>
<figure id="nips"><h2>21. Browse the approved NIPS dataset</h2><img src="21-nips.png" width="1440" height="1000" alt="Browse the approved NIPS dataset"><figcaption><p>NIPS-FM contains 3,777 nodes and 5,257 relations. Opening it starts with a bounded neighborhood; the full graph remains stored for subsequent navigation and export.</p></figcaption></figure>
<figure id="label-overlap"><h2>22. Inspect overlapping node labels</h2><img src="22-label-overlap.png" width="1440" height="1000" alt="Inspect overlapping node labels"><figcaption><p>The graph-browser example retains RFC on its center node. Point-based layout can leave wide node labels intersecting even when their centers are apart. Label spacing uses the measured visible bodies, including multiline labels and importance scaling.</p></figcaption></figure>
<figure id="labels-separated"><h2>23. Separate overlapping nodes</h2><img src="23-labels-separated.png" width="1440" height="1000" alt="Separate overlapping nodes"><figcaption><p>Separate overlapping nodes arranges visible bodies with a requested gap and pauses motion. Pinned nodes and the viewing focus stay in place; semantic relations, RFC, hidden nodes and viewing settings are retained. The status reports remaining intersections. Resuming motion or changing the view can introduce new overlaps; relation labels and crossings are separate concerns.</p></figcaption></figure>
<figure id="relation-overlap"><h2>24. Inspect original relation-label positions</h2><img src="24-relation-overlap.png" width="1440" height="1000" alt="Inspect original relation-label positions"><figcaption><p>With node bodies already separated and motion paused, turn off Avoid relation label overlaps to inspect the original midpoint-and-offset anchors. Relation text can still intersect node bodies or other relation labels. The following view uses these exact node positions and curves.</p></figcaption></figure>
<figure id="relations-separated"><h2>25. Place relation labels near clear curve positions</h2><img src="25-relations-separated.png" width="1440" height="1000" alt="Place relation labels near clear curve positions"><figcaption><p>Avoid relation label overlaps measures SVG text and tries nearby positions along each curve and its normal. The browser enables this bounded presentation pass by default. It reduces label–node and label–label intersections in this view while retaining every label, node position and curve. Dense views can still overlap; toggling off restores original anchors.</p></figcaption></figure>
<figure id="label-weight"><h2>26. Edit labels and weights together</h2><img src="26-label-weight.png" width="1440" height="1000" alt="Edit labels and weights together"><figcaption><p>F2 opens a graph-anchored label overlay with weight controls for either a node or a relation. Ctrl+G/H adjusts the shared draft; a numeric suffix such as Graph browsers =3 also sets absolute weight on Save. The draft leaves the graph unchanged until committed; Escape cancels both label and weight.</p></figcaption></figure>
<figure id="details-editor"><h2>27. Edit node details directly in an overlay</h2><img src="27-details-editor.png" width="1440" height="1000" alt="Edit node details directly in an overlay"><figcaption><p>Ctrl+Enter commits the weight. Ctrl+Space or Shift+F2 then opens the full modeless editor at the node annotation, outside the side pane. It also exposes types, visual settings, URLs and metadata. Close retains a per-item draft; Save commits and Escape cancels. The annotation shown here is still a draft.</p></figcaption></figure>
<figure id="hover-keyboard"><h2>28. Point at the graph to control its center</h2><img src="28-hover-keyboard.png" width="1440" height="1000" alt="Point at the graph to control its center"><figcaption><p>Close the editor, clear selection and move the pointer over a branch without clicking. Keyboard control resumes at the node in the viewport center, independently of the hovered branch. Enter acts immediately on that centered target; arrow navigation then continues from the selected node.</p></figcaption></figure>
<figure id="control-focus"><h2>29. Explicit control focus takes priority</h2><img src="29-control-focus.png" width="1440" height="1000" alt="Explicit control focus takes priority"><figcaption><p>Focus Graph spacing in the side pane, then point back at the graph. The input keeps focus and Enter belongs to that control. Editors, buttons and summaries have the same protection. Click or Tab into the graph when ready to return keyboard control.</p></figcaption></figure>
<figure id="layout-damping"><h2>30. Suppress oscillation with or without RFC</h2><img src="30-layout-damping.png" width="1440" height="1000" alt="Suppress oscillation with or without RFC"><figcaption><p>View → Layout motion enables general adaptive damping by default. It watches all movable visible nodes, including when RFC is off as shown here. Adaptive impulses attenuates repeated swings and gradually restores gain; Earlier TouchGraph cooling instead starts the inherited fast cooling phase after detected cycles. The status makes the active setting visible.</p></figcaption></figure>
</main><script>
const slides=[...document.querySelectorAll('figure')],previous=document.querySelector('#previous'),next=document.querySelector('#next');let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>slide.hidden=i!==current);previous.disabled=current===0;next.disabled=current===slides.length-1;document.querySelector('#position').textContent=(current+1)+' / '+slides.length;history.replaceState(null,'','#'+slides[current].id);}
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',event=>{const index=event.key==='ArrowLeft'?current-1:event.key==='ArrowRight'?current+1:event.key==='Home'?0:event.key==='End'?slides.length-1:null;if(index!==null&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey){event.preventDefault();show(index);}});
window.addEventListener('hashchange',()=>show(slides.findIndex(slide=>slide.id===location.hash.slice(1))));show(Math.max(0,slides.findIndex(slide=>slide.id===location.hash.slice(1))));
</script></body></html>
