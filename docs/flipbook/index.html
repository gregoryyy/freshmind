<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshmind 4 walkthrough</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f0;color:#263e33}header,main{max-width:1440px;margin:auto;padding:16px}h1{font-size:22px;margin:0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:5px 14px;cursor:pointer}button:disabled{cursor:default}figure{margin:0 0 30px}figure[hidden]{display:none}img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border:1px solid #c4cdbf}h2{font-size:18px}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #6cb08b;outline-offset:3px}</style></head>
<body><header><h1>Freshmind 4 walkthrough</h1><nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next" type="button">Next</button><a href="README.md">Markdown walkthrough</a></nav></header><main>
<figure id="browser"><h2>1. Graph browser</h2><img src="01-browser.png" width="1440" height="1000" alt="Graph browser"><figcaption><p>The main browser opens a local neighborhood. Select nodes to inspect their connections; dragging, pinning and neighborhood controls use the same graph model.</p></figcaption></figure>
<figure id="neighborhood"><h2>2. Reveal the complete graph</h2><img src="02-neighborhood.png" width="1440" height="1000" alt="Reveal the complete graph"><figcaption><p>Show whole graph reveals stored nodes beyond the current neighborhood. Expansion, collapse and hiding change the visible graph while retaining the complete graph for editing and export.</p></figcaption></figure>
<figure id="view-controls"><h2>3. Graph spacing, canvas zoom and viewing lens</h2><img src="03-view-controls.png" width="1440" height="1000" alt="Graph spacing, canvas zoom and viewing lens"><figcaption><p>Graph spacing changes node distances. Canvas zoom scales shapes, labels and strokes together. The focus + context slider applies the independent nonlinear viewing lens.</p></figcaption></figure>
<figure id="key-map"><h2>4. User key map</h2><img src="04-key-map.png" width="1440" height="1000" alt="User key map"><figcaption><p>The help dialog and docs/KEYMAP.md share the same implemented command definitions, including graph spacing, canvas zoom, navigation, editing and file shortcuts.</p></figcaption></figure>
<figure id="types"><h2>5. Node types and curved relations</h2><img src="05-types.png" width="1440" height="1000" alt="Node types and curved relations"><figcaption><p>The palette page shows all 21 configured Freshmind node types, labeled curved relations, parallel edges and a self-loop. Its YAML editor applies semantic and visual configuration to the existing graph.</p></figcaption></figure>
<figure id="berry"><h2>6. Open the approved Berry example</h2><img src="06-berry.png" width="1440" height="1000" alt="Open the approved Berry example"><figcaption><p>Berry is one of the two approved migrated datasets. The native YAML graph retains 21 nodes and 22 relations, annotations and original linked-resource paths.</p></figcaption></figure>
<figure id="public-network"><h2>7. Florentine families</h2><img src="07-public-network.png" width="1440" height="1000" alt="Florentine families"><figcaption><p>This public example has 15 families and 20 undirected marriage links. Node content contains graph-derived summaries and links to the connected families, with source attribution retained in the document.</p></figcaption></figure>
<figure id="inline-edit"><h2>8. Edit a multiline node label</h2><img src="08-inline-edit.png" width="1440" height="1000" alt="Edit a multiline node label"><figcaption><p>F2 opens an inline label editor on the selected node. A draft stays separate from the model until committed; node identity, relations and annotations are retained.</p></figcaption></figure>
<figure id="annotation"><h2>9. Annotations and item details</h2><img src="09-annotation.png" width="1440" height="1000" alt="Annotations and item details"><figcaption><p>Ctrl+Enter commits the label. Space or Show details opens the selected node&#39;s content in a separate, resizable popup. Internal links navigate to connected nodes; Edit content delegates to the annotation inspector.</p></figcaption></figure>
<figure id="save-yaml"><h2>10. Save the complete graph as YAML</h2><img src="10-save-yaml.png" width="1440" height="1000" alt="Save the complete graph as YAML"><figcaption><p>Ctrl+Shift+S opens the filename dialog. Saving downloads the complete stored graph, including hidden nodes, with optional layout/view state and embedded or companion type configuration.</p></figcaption></figure>
<figure id="rfc-baseline"><h2>11. Single-focus comparison: ordinary layout</h2><img src="11-rfc-baseline.png" width="1440" height="1000" alt="Single-focus comparison: ordinary layout"><figcaption><p>The synthetic crowded-star fixture uses a fixed center and fixed context anchors. This is the ordinary TouchGraph layout after 250 batches from the saved initial coordinates; RFC is off. Both comparison views use 200% graph spacing and 100% canvas zoom for readability.</p></figcaption></figure>
<figure id="rfc-attraction"><h2>12. Single-focus comparison: attraction reinforcement</h2><img src="12-rfc-attraction.png" width="1440" height="1000" alt="Single-focus comparison: attraction reinforcement"><figcaption><p>Reload the identical graph, choose Attraction only and run 250 batches. This earlier preset combines attraction multiplier 3 with angular stiffness 300, without a target-length spring. Soft yellow halos identify the reinforced nodes and relations; semantic graph records remain unchanged.</p></figcaption></figure>
<figure id="rfc"><h2>13. Single-focus comparison: length-constrained tree</h2><img src="13-rfc.png" width="1440" height="1000" alt="Single-focus comparison: length-constrained tree"><figcaption><p>The default Tree structure preset combines target focal length 120, radial stiffness 1 and angular stiffness 10000. From the same starting graph and after 250 batches, the focal star is more regular. Both stronger angular constraints and the new length spring contribute. RFC halos fade away without a rim; focal-region exclusion remains later work.</p></figcaption></figure>
<figure id="rfc-weighted"><h2>14. Weighted RFC for horizontally extended labels</h2><img src="14-rfc-weighted.png" width="1440" height="1000" alt="Weighted RFC for horizontally extended labels"><figcaption><p>The wide-label fixture uses horizontal coordinate weight 0.25 and vertical weight 1. Equal angles are measured in weighted physical coordinates, permitting a wider focal layout while the viewing lens and both zooms stay independent. Ordinary context springs still compete with reinforcement; the metric alone does not guarantee clear space or eliminate label overlaps.</p></figcaption></figure>
<figure id="nips"><h2>15. Browse the approved NIPS dataset</h2><img src="15-nips.png" width="1440" height="1000" alt="Browse the approved NIPS dataset"><figcaption><p>NIPS-FM contains 3,777 nodes and 5,257 relations. Opening it starts with a bounded neighborhood; the full graph remains stored for subsequent navigation and export.</p></figcaption></figure>
</main><script>
const slides=[...document.querySelectorAll('figure')],previous=document.querySelector('#previous'),next=document.querySelector('#next');let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>slide.hidden=i!==current);previous.disabled=current===0;next.disabled=current===slides.length-1;document.querySelector('#position').textContent=(current+1)+' / '+slides.length;history.replaceState(null,'','#'+slides[current].id);}
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',event=>{const index=event.key==='ArrowLeft'?current-1:event.key==='ArrowRight'?current+1:event.key==='Home'?0:event.key==='End'?slides.length-1:null;if(index!==null&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey){event.preventDefault();show(index);}});
window.addEventListener('hashchange',()=>show(slides.findIndex(slide=>slide.id===location.hash.slice(1))));show(Math.max(0,slides.findIndex(slide=>slide.id===location.hash.slice(1))));
</script></body></html>
