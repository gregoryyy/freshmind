<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f0;color:#263e33}header,main{max-width:1440px;margin:auto;padding:16px}h1{font-size:22px;margin:0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:5px 14px;cursor:pointer}button:disabled{cursor:default}figure{margin:0 0 30px}figure[hidden]{display:none}img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border:1px solid #c4cdbf}h2{font-size:18px}a{color:inherit}nav[aria-label="Walkthrough chapters"] a{padding:4px 9px;border:1px solid #c4cdbf;border-radius:4px;text-decoration:none}nav a[aria-current]{background:#dbe9df;font-weight:650}.chapter{margin:0;color:#526b5d;font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #6cb08b;outline-offset:3px}</style></head>
<body><header><h1>Freshmind 4 walkthrough</h1><nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next" type="button">Next</button><a href="README.md">Markdown walkthrough</a></nav><nav aria-label="Walkthrough chapters"><a href="#browser" data-chapter="Explore">Explore (4)</a><a href="#search-library" data-chapter="Search">Search (9)</a><a href="#types" data-chapter="Files and content">Files and content (7)</a><a href="#rfc-baseline" data-chapter="Focus + context">Focus + context (10)</a><a href="#label-overlap" data-chapter="Readability">Readability (4)</a><a href="#label-weight" data-chapter="Editing and keyboard">Editing and keyboard (4)</a><a href="#layout-damping" data-chapter="Layout motion">Layout motion (1)</a></nav></header><main>
<figure id="browser" data-chapter="Explore"><p class="chapter">Explore</p><h2>1. Graph browser with RFC on the center node</h2><img src="01-browser.png" width="1440" height="1000" alt="Graph browser with RFC on the center node"><figcaption><p>The graph-browser example opens with Reinforcement Focus+Context active on its central Graph browsers node. Yellow halos identify the reinforced center and its five immediate branches; the surrounding graph retains its ordinary connections and forces.</p></figcaption></figure>
<figure id="neighborhood" data-chapter="Explore"><p class="chapter">Explore</p><h2>2. Reveal the complete graph</h2><img src="02-neighborhood.png" width="1440" height="1000" alt="Reveal the complete graph"><figcaption><p>Show whole graph reveals stored nodes beyond the current neighborhood. Expansion, collapse and hiding change the visible graph while retaining the complete graph for editing and export.</p></figcaption></figure>
<figure id="view-controls" data-chapter="Explore"><p class="chapter">Explore</p><h2>3. Graph spacing, canvas zoom and viewing lens</h2><img src="03-view-controls.png" width="1440" height="1000" alt="Graph spacing, canvas zoom and viewing lens"><figcaption><p>Graph spacing changes node distances. Canvas zoom scales shapes, labels and strokes together. The focus + context slider applies the independent nonlinear viewing lens.</p></figcaption></figure>
<figure id="key-map" data-chapter="Explore"><p class="chapter">Explore</p><h2>4. User key map</h2><img src="04-key-map.png" width="1440" height="1000" alt="User key map"><figcaption><p>The help dialog and docs/KEYMAP.md share the same implemented command definitions, including graph spacing, canvas zoom, navigation, editing and file shortcuts.</p></figcaption></figure>
<figure id="search-library" data-chapter="Search"><p class="chapter">Search</p><h2>5. A searchable research library</h2><img src="05-search-library.png" width="1440" height="1000" alt="A searchable research library"><figcaption><p>This fictional graph contains 24 nodes and 28 semantic relations: three researchers, eighteen papers, two bridge papers and a collection. Labels, annotations and exact tags are searchable, including hidden items. The library starts without reinforcement; successful searches activate RFC around their query or similarity source.</p></figcaption></figure>
<figure id="search-query-draft" data-chapter="Search"><p class="chapter">Search</p><h2>6. Start a search directly on the graph</h2><img src="06-search-query-draft.png" width="1440" height="1000" alt="Start a search directly on the graph"><figcaption><p>Select Mira Vega and press Ctrl+F. A query node appears immediately, linked to Mira as context, with its text editor on the graph. Type spring layout and press Enter to retrieve. The empty draft is excluded from the search corpus; ordinary typing and text deletion keep their normal meaning.</p></figcaption></figure>
<figure id="search-lexical-query" data-chapter="Search"><p class="chapter">Search</p><h2>7. A term query joins its context</h2><img src="07-search-lexical-query.png" width="1440" height="1000" alt="A term query joins its context"><figcaption><p>Enter runs the literal query and reinforces its neighborhood around the query node. Solid green links show compact ranks (#1, #2, …); the dashed green link identifies context. Blue semantic relations remain. Hover a result for the exact engine/score. F2 edits and reruns the query without duplicating it.</p></figcaption></figure>
<figure id="search-exact-tags" data-chapter="Search"><p class="chapter">Search</p><h2>8. Whole-tag retrieval</h2><img src="08-search-exact-tags.png" width="1440" height="1000" alt="Whole-tag retrieval"><figcaption><p>The same query node now retrieves exact visual search tags. Tags are explicit metadata and work without topic training. The query replaces its earlier result links while retaining context and manual semantic relations.</p></figcaption></figure>
<figure id="search-topic-model" data-chapter="Search"><p class="chapter">Search</p><h2>9. Train and inspect topics</h2><img src="09-search-topic-model.png" width="1440" height="1000" alt="Train and inspect topics"><figcaption><p>Three topics are trained locally for 200 serial Gibbs passes with seed 4357, alpha 0.1, beta 0.01 and minimum document frequency 2. Separate local JSON files can save/reload the model and its corpus. The most probable words make the fitted topics inspectable. This deliberately separated synthetic corpus does not establish general retrieval quality.</p></figcaption></figure>
<figure id="search-topical-query" data-chapter="Search"><p class="chapter">Search</p><h2>10. Retrieve by inferred topics</h2><img src="10-search-topical-query.png" width="1440" height="1000" alt="Retrieve by inferred topics"><figcaption><p>Ctrl+Shift+F starts a separate LDA query. Enter submits geometry repulsion and moves RFC to this query. Green rank labels stay short; hovering reveals symmetric KL distance in bits (lower is better, default limit 0.6). The earlier tag query stays available. Relevance does not change node importance or RFC stiffness.</p></figcaption></figure>
<figure id="search-node-similarity" data-chapter="Search"><p class="chapter">Search</p><h2>11. Use an existing paper as the query</h2><img src="11-search-node-similarity.png" width="1440" height="1000" alt="Use an existing paper as the query"><figcaption><p>Select Spring neighborhoods and press Ctrl+Shift+R to retrieve topic similarities and reinforce a neighborhood around this paper. Ctrl+R provides literal similarity. Compact green ranked links stay distinct from existing blue authored/citation relations. No separate results page is needed.</p></figcaption></figure>
<figure id="search-rejected-result" data-chapter="Search"><p class="chapter">Search</p><h2>12. Retain a negative judgment</h2><img src="12-search-rejected-result.png" width="1440" height="1000" alt="Retain a negative judgment"><figcaption><p>Rejecting a selected green result relation removes that link and saves its source, target, query, engine and corpus provenance. Repeating the same query omits that item. Native YAML saves queries, remaining links and feedback; model JSON is saved separately through the training controls. Feedback learning remains future work.</p></figcaption></figure>
<figure id="search-delete-query" data-chapter="Search"><p class="chapter">Search</p><h2>13. Remove a query and keep the source graph</h2><img src="13-search-delete-query.png" width="1440" height="1000" alt="Remove a query and keep the source graph"><figcaption><p>Select the LDA text-query node and press Ctrl+Backspace (or Ctrl+Delete) while graph focus is active. Only that query and its incident associations disappear; retrieved papers, original semantic relations, the earlier tag query and the paper-based similarity search remain. Native YAML can retain the queries and rejection judgments you choose to keep.</p></figcaption></figure>
<figure id="types" data-chapter="Files and content"><p class="chapter">Files and content</p><h2>14. Node types and curved relations</h2><img src="14-types.png" width="1440" height="1000" alt="Node types and curved relations"><figcaption><p>The palette page shows all 21 configured Freshmind node types, labeled curved relations, parallel edges and a self-loop. Its YAML editor applies semantic and visual configuration to the existing graph.</p></figcaption></figure>
<figure id="berry" data-chapter="Files and content"><p class="chapter">Files and content</p><h2>15. Open the approved Berry example</h2><img src="15-berry.png" width="1440" height="1000" alt="Open the approved Berry example"><figcaption><p>Berry is one of the two approved migrated datasets. The native YAML graph retains 21 nodes and 22 relations, annotations and original linked-resource paths.</p></figcaption></figure>
<figure id="nips" data-chapter="Files and content"><p class="chapter">Files and content</p><h2>16. Browse the approved NIPS dataset</h2><img src="16-nips.png" width="1440" height="1000" alt="Browse the approved NIPS dataset"><figcaption><p>NIPS-FM contains 3,777 nodes and 5,257 relations. Opening it starts with a bounded neighborhood; the full graph remains stored for subsequent navigation and export.</p></figcaption></figure>
<figure id="public-network" data-chapter="Files and content"><p class="chapter">Files and content</p><h2>17. Florentine families</h2><img src="17-public-network.png" width="1440" height="1000" alt="Florentine families"><figcaption><p>This public example has 15 families and 20 undirected marriage links. Node content contains graph-derived summaries and links to the connected families, with source attribution retained in the document.</p></figcaption></figure>
<figure id="inline-edit" data-chapter="Files and content"><p class="chapter">Files and content</p><h2>18. Edit a multiline node label</h2><img src="18-inline-edit.png" width="1440" height="1000" alt="Edit a multiline node label"><figcaption><p>F2 opens an inline label editor on the selected node. A draft stays separate from the model until committed; node identity, relations and annotations are retained.</p></figcaption></figure>
<figure id="annotation" data-chapter="Files and content"><p class="chapter">Files and content</p><h2>19. Annotations and item details</h2><img src="19-annotation.png" width="1440" height="1000" alt="Annotations and item details"><figcaption><p>Ctrl+Enter commits the label. Space or Show details opens the selected node&#39;s content in a separate, resizable popup. Internal links navigate to connected nodes; Edit content opens the annotation overlay.</p></figcaption></figure>
<figure id="save-yaml" data-chapter="Files and content"><p class="chapter">Files and content</p><h2>20. Save the complete graph as YAML</h2><img src="20-save-yaml.png" width="1440" height="1000" alt="Save the complete graph as YAML"><figcaption><p>Ctrl+Shift+S opens the filename dialog. Saving downloads the complete stored graph, including hidden nodes, with optional layout/view state and embedded or companion type configuration.</p></figcaption></figure>
<figure id="rfc-baseline" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>21. Single-focus comparison: ordinary layout</h2><img src="21-rfc-baseline.png" width="1440" height="1000" alt="Single-focus comparison: ordinary layout"><figcaption><p>The synthetic crowded-star fixture uses a fixed center and fixed context anchors. This is the ordinary TouchGraph layout after 250 batches from the saved initial coordinates; RFC is off. Adaptive damping is off throughout the fixed-force comparison. Both comparison views use 200% graph spacing and 100% canvas zoom for readability.</p></figcaption></figure>
<figure id="rfc-attraction" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>22. Single-focus comparison: attraction reinforcement</h2><img src="22-rfc-attraction.png" width="1440" height="1000" alt="Single-focus comparison: attraction reinforcement"><figcaption><p>Reload the identical graph, choose Attraction only and run 250 batches. This earlier preset combines attraction multiplier 3 with angular stiffness 300, without a target-length spring. Soft yellow halos identify the reinforced nodes and relations; semantic graph records remain unchanged.</p></figcaption></figure>
<figure id="rfc" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>23. Single-focus comparison: length-constrained tree</h2><img src="23-rfc.png" width="1440" height="1000" alt="Single-focus comparison: length-constrained tree"><figcaption><p>The default Tree structure preset combines target focal length 120, radial stiffness 1 and angular stiffness 10000. From the same starting graph and after 250 batches, the focal star is more regular. Both stronger angular constraints and the new length spring contribute. Yellow halos show reinforcement; optional focal-region exclusion is demonstrated separately below.</p></figcaption></figure>
<figure id="rfc-weighted" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>24. Weighted RFC for horizontally extended labels</h2><img src="24-rfc-weighted.png" width="1440" height="1000" alt="Weighted RFC for horizontally extended labels"><figcaption><p>The wide-label fixture uses horizontal coordinate weight 0.25 and vertical weight 1. Equal angles are measured in weighted physical coordinates, permitting a wider focal layout while the viewing lens and both zooms stay independent. Ordinary context springs still compete with reinforcement; the metric alone does not guarantee clear space or eliminate label overlaps.</p></figcaption></figure>
<figure id="multiple-foci" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>25. Reinforce multiple stored trees</h2><img src="25-multiple-foci.png" width="1440" height="1000" alt="Reinforce multiple stored trees"><figcaption><p>Two saved tree definitions reinforce deeper neighborhoods at the same time. Their context relations remain ordinary graph edges. Stored membership survives YAML export; active RFC centers are temporary view state. Shift+Enter can also add or remove an individual center.</p></figcaption></figure>
<figure id="clusters" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>26. Overlapping clusters and their boundaries</h2><img src="26-clusters.png" width="1440" height="1000" alt="Overlapping clusters and their boundaries"><figcaption><p>RFC can reinforce cyclic clusters as well as trees. These two stored clusters share a member, retain their internal relations and show translucent boundaries. Cluster rigidity controls resistance to deformation; the representative selects the group without becoming a physical anchor.</p></figcaption></figure>
<figure id="focal-regions" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>27. Optional focal-region exclusion</h2><img src="27-focal-regions.png" width="1440" height="1000" alt="Optional focal-region exclusion"><figcaption><p>Dashed physical regions show the space reserved around two reinforced structures. Optional exclusion pushes context and non-shared focal nodes away from those regions while shared members remain exempt from their own regions. The forces are soft; pinned nodes and labels can still overlap.</p></figcaption></figure>
<figure id="importance" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>28. Node importance and exact weight values</h2><img src="28-importance.png" width="1440" height="1000" alt="Node importance and exact weight values"><figcaption><p>Node weight scales body and label size within configured limits. Weight 1 keeps normal size and weight 0 remains visible. Optional values make weights explicit when labels differ in length. Size shows importance; yellow halos independently show RFC participation.</p></figcaption></figure>
<figure id="structural-view" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>29. Combine RFC with structural aggregation</h2><img src="29-structural-view.png" width="1440" height="1000" alt="Combine RFC with structural aggregation"><figcaption><p>The structural focus + context example combines a viewing lens, RFC and reversible Person/Paper leaf aggregation. Six of thirteen nodes remain visible, with seven aggregated leaves counted under their parents. The shared collaborator stays visible because it connects two semantic neighbors. The complete graph remains intact.</p></figcaption></figure>
<figure id="reveal-detail" data-chapter="Focus + context"><p class="chapter">Focus + context</p><h2>30. Reveal aggregated detail without losing context</h2><img src="30-reveal-detail.png" width="1440" height="1000" alt="Reveal aggregated detail without losing context"><figcaption><p>Select Group Beta and reveal its leaves to restore detail while retaining the current graph, focal center and lens. Nine nodes are now visible. E also reveals a selected parent&#39;s leaves; Reset structural view restores the current neighborhood without deleting semantic data.</p></figcaption></figure>
<figure id="label-overlap" data-chapter="Readability"><p class="chapter">Readability</p><h2>31. Inspect overlapping node labels</h2><img src="31-label-overlap.png" width="1440" height="1000" alt="Inspect overlapping node labels"><figcaption><p>The graph-browser example retains RFC on its center node. Point-based layout can leave wide node labels intersecting even when their centers are apart. Label spacing uses the measured visible bodies, including multiline labels and importance scaling.</p></figcaption></figure>
<figure id="labels-separated" data-chapter="Readability"><p class="chapter">Readability</p><h2>32. Separate overlapping nodes</h2><img src="32-labels-separated.png" width="1440" height="1000" alt="Separate overlapping nodes"><figcaption><p>Separate overlapping nodes arranges visible bodies with a requested gap and pauses motion. Pinned nodes and the viewing focus stay in place; semantic relations, RFC, hidden nodes and viewing settings are retained. The status reports remaining intersections. Resuming motion or changing the view can introduce new overlaps; relation labels and crossings are separate concerns.</p></figcaption></figure>
<figure id="relation-overlap" data-chapter="Readability"><p class="chapter">Readability</p><h2>33. Inspect original relation-label positions</h2><img src="33-relation-overlap.png" width="1440" height="1000" alt="Inspect original relation-label positions"><figcaption><p>With node bodies already separated and motion paused, turn off Avoid relation label overlaps to inspect the original midpoint-and-offset anchors. Relation text can still intersect node bodies or other relation labels. The following view uses these exact node positions and curves.</p></figcaption></figure>
<figure id="relations-separated" data-chapter="Readability"><p class="chapter">Readability</p><h2>34. Place relation labels near clear curve positions</h2><img src="34-relations-separated.png" width="1440" height="1000" alt="Place relation labels near clear curve positions"><figcaption><p>Avoid relation label overlaps measures SVG text and tries nearby positions along each curve and its normal. The browser enables this bounded presentation pass by default. It reduces label–node and label–label intersections in this view while retaining every label, node position and curve. Dense views can still overlap; toggling off restores original anchors.</p></figcaption></figure>
<figure id="label-weight" data-chapter="Editing and keyboard"><p class="chapter">Editing and keyboard</p><h2>35. Edit labels and weights together</h2><img src="35-label-weight.png" width="1440" height="1000" alt="Edit labels and weights together"><figcaption><p>F2 opens a graph-anchored label overlay with weight controls for either a node or a relation. Ctrl+G/H adjusts the shared draft; a numeric suffix such as Graph browsers =3 also sets absolute weight on Save. The draft leaves the graph unchanged until committed; Escape cancels both label and weight.</p></figcaption></figure>
<figure id="details-editor" data-chapter="Editing and keyboard"><p class="chapter">Editing and keyboard</p><h2>36. Edit node details directly in an overlay</h2><img src="36-details-editor.png" width="1440" height="1000" alt="Edit node details directly in an overlay"><figcaption><p>Ctrl+Enter commits the weight. Ctrl+Space or Shift+F2 then opens the full modeless editor at the node annotation, outside the side pane. It also exposes types, visual settings, URLs and metadata. Close retains a per-item draft; Save commits and Escape cancels. The annotation shown here is still a draft.</p></figcaption></figure>
<figure id="hover-keyboard" data-chapter="Editing and keyboard"><p class="chapter">Editing and keyboard</p><h2>37. Point at the graph to control its center</h2><img src="37-hover-keyboard.png" width="1440" height="1000" alt="Point at the graph to control its center"><figcaption><p>Close the editor, clear selection and move the pointer over a branch without clicking. Keyboard control resumes at the node in the viewport center, independently of the hovered branch. Enter acts immediately on that centered target; arrow navigation then continues from the selected node.</p></figcaption></figure>
<figure id="control-focus" data-chapter="Editing and keyboard"><p class="chapter">Editing and keyboard</p><h2>38. Explicit control focus takes priority</h2><img src="38-control-focus.png" width="1440" height="1000" alt="Explicit control focus takes priority"><figcaption><p>Focus Graph spacing in the side pane, then point back at the graph. The input keeps focus and Enter belongs to that control. Editors, buttons and summaries have the same protection. Click or Tab into the graph when ready to return keyboard control.</p></figcaption></figure>
<figure id="layout-damping" data-chapter="Layout motion"><p class="chapter">Layout motion</p><h2>39. Suppress oscillation with or without RFC</h2><img src="39-layout-damping.png" width="1440" height="1000" alt="Suppress oscillation with or without RFC"><figcaption><p>View → Layout motion enables general adaptive damping by default. It watches all movable visible nodes, including when RFC is off as shown here. Adaptive impulses attenuates repeated swings and gradually restores gain; Earlier TouchGraph cooling instead starts the inherited fast cooling phase after detected cycles. The status makes the active setting visible.</p></figcaption></figure>
</main><script>
const slides=[...document.querySelectorAll('figure')],previous=document.querySelector('#previous'),next=document.querySelector('#next');let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>slide.hidden=i!==current);previous.disabled=current===0;next.disabled=current===slides.length-1;document.querySelector('#position').textContent=(current+1)+' / '+slides.length;for(const link of document.querySelectorAll('nav [data-chapter]')){if(link.dataset.chapter===slides[current].dataset.chapter)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');}history.replaceState(null,'','#'+slides[current].id);}
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',event=>{const index=event.key==='ArrowLeft'?current-1:event.key==='ArrowRight'?current+1:event.key==='Home'?0:event.key==='End'?slides.length-1:null;if(index!==null&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey){event.preventDefault();show(index);}});
window.addEventListener('hashchange',()=>show(slides.findIndex(slide=>slide.id===location.hash.slice(1))));show(Math.max(0,slides.findIndex(slide=>slide.id===location.hash.slice(1))));
</script></body></html>
