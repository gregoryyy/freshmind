<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshmind 4 control panel</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f0;color:#263e33}header,main{max-width:1440px;margin:auto;padding:16px}h1{font-size:22px;margin:0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:5px 14px;cursor:pointer}button:disabled{cursor:default}figure{margin:0 0 30px}figure[hidden]{display:none}img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border:1px solid #c4cdbf}h2{font-size:18px}a{color:inherit}nav[aria-label="Walkthrough chapters"] a{padding:4px 9px;border:1px solid #c4cdbf;border-radius:4px;text-decoration:none}nav a[aria-current]{background:#dbe9df;font-weight:650}.chapter{margin:0;color:#526b5d;font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #6cb08b;outline-offset:3px}</style></head>
<body><header><h1>Freshmind 4 control panel</h1><nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next" type="button">Next</button><a href="README.md">Markdown walkthrough</a></nav></header><main>
<figure id="layout"><h2>1. Layout controls as sliders and horizontal choices</h2><img src="01-layout.png" width="1440" height="1000" alt="Layout controls as sliders and horizontal choices"><figcaption><p>The weighted-tree example is paused and its measured labels separated with the shipped readability command. RFC settings use sliders with live values. Short choices use horizontal radio groups; large example/substructure inventories keep menus. These are presentation controls over the existing graph and configuration owners.</p></figcaption></figure>
<figure id="search"><h2>2. Search methods, metrics and result limits</h2><img src="02-search.png" width="1440" height="1000" alt="Search methods, metrics and result limits"><figcaption><p>Lexical/LDA and term/tag choices are directly visible. The LDA metric names remain available to assistive technology and on hover. An unchecked custom-distance limit retains the engine defaults; selecting a metric or moving a slider keeps the existing retrieval boundary.</p></figcaption></figure>
<figure id="training"><h2>3. Topic-model settings remain local and inspectable</h2><img src="03-training.png" width="1440" height="1000" alt="Topic-model settings remain local and inspectable"><figcaption><p>Topics, passes, random seed, vocabulary frequency and priors use sliders and live values. Wide magnitude ranges use logarithmic scales; integer arrows retain exact increments, including the random seed. The graph is not searched or retrained for this control demonstration.</p></figcaption></figure>
<figure id="retracted"><h2>4. Retract the controls and keep the document</h2><img src="04-retracted.png" width="1440" height="1000" alt="Retract the controls and keep the document"><figcaption><p>Controls hides the panel and gives the graph its width. Settings, open sections and scroll position remain available when it reopens; quick search reveals its query field. Collapsing changes viewport geometry, preserving physical node coordinates and semantic data. The preference is session-only.</p></figcaption></figure>
</main><script>
const slides=[...document.querySelectorAll('figure')],previous=document.querySelector('#previous'),next=document.querySelector('#next');let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>slide.hidden=i!==current);previous.disabled=current===0;next.disabled=current===slides.length-1;document.querySelector('#position').textContent=(current+1)+' / '+slides.length;for(const link of document.querySelectorAll('nav [data-chapter]')){if(link.dataset.chapter===slides[current].dataset.chapter)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');}history.replaceState(null,'','#'+slides[current].id);}
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',event=>{const index=event.key==='ArrowLeft'?current-1:event.key==='ArrowRight'?current+1:event.key==='Home'?0:event.key==='End'?slides.length-1:null;if(index!==null&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey){event.preventDefault();show(index);}});
window.addEventListener('hashchange',()=>show(slides.findIndex(slide=>slide.id===location.hash.slice(1))));show(Math.max(0,slides.findIndex(slide=>slide.id===location.hash.slice(1))));
</script></body></html>
