<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshmind 4 RFC and hybrid showcase</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f0;color:#263e33}header,main{max-width:1440px;margin:auto;padding:16px}h1{font-size:22px;margin:0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:5px 14px;cursor:pointer}button:disabled{cursor:default}figure{margin:0 0 30px}figure[hidden]{display:none}img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border:1px solid #c4cdbf}h2{font-size:18px}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #6cb08b;outline-offset:3px}</style></head>
<body><header><h1>Freshmind 4 RFC and hybrid showcase</h1><nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next" type="button">Next</button><a href="README.md">Markdown walkthrough</a></nav></header><main>
<figure id="plain"><h2>1. Plain community graph</h2><img src="01-plain.png" width="1440" height="1000" alt="Plain community graph"><figcaption><p>The whole synthetic research community contains 34 typed nodes and 37 relations: six projects, three groups, seven people and eighteen notes. Project collaboration, shared group membership and a citation connect the surrounding context.</p></figcaption></figure>
<figure id="lens"><h2>2. Viewing focus + context</h2><img src="02-lens.png" width="1440" height="1000" alt="Viewing focus + context"><figcaption><p>The viewing lens enlarges the area around Graph Atlas while retaining distant context. It transforms display positions independently of physical layout. This scene starts from the same saved coordinates and runs the same number of layout batches as the plain view.</p></figcaption></figure>
<figure id="single"><h2>3. One reinforced neighborhood</h2><img src="03-single.png" width="1440" height="1000" alt="One reinforced neighborhood"><figcaption><p>Graph Atlas has five reinforced branches: two groups and three notes. Target-length and angular reinforcement use horizontally weighted coordinates; soft focal-region exclusion pushes context away. Complete semantic graph data remains unchanged.</p></figcaption></figure>
<figure id="two"><h2>4. Two independent RFC foci</h2><img src="04-two.png" width="1440" height="1000" alt="Two independent RFC foci"><figcaption><p>Graph Atlas and Topic Lens have separate focal neighborhoods, with Semantic Methods shared between them. Halos identify their eleven distinct members, and dashed boundaries follow the current viewing transform. Soft context/non-shared exclusion complements reinforcement; surrounding semantic relations remain present.</p></figcaption></figure>
<figure id="hybrid"><h2>5. RFC with structural aggregation</h2><img src="05-hybrid.png" width="1440" height="1000" alt="RFC with structural aggregation"><figcaption><p>The two foci retain their detail while sixteen remote leaf people and papers aggregate into typed parent counts. Eighteen of 34 nodes and 21 of 37 relations remain visible. The shared group, Maya&#39;s two-group collaboration and the citation-bearing context papers remain explicit. Reveal a parent&#39;s leaves to inspect its detail.</p></figcaption></figure>
<figure id="hybrid-lens"><h2>6. Hybrid focus + context with the viewing lens</h2><img src="06-hybrid-lens.png" width="1440" height="1000" alt="Hybrid focus + context with the viewing lens"><figcaption><p>The viewing lens composes with the same two focal neighborhoods and reversible aggregation rules. All 34 nodes, 37 relations and two stored focal definitions remain available for browsing, editing and YAML export. The showcase demonstrates the original tasks with a new graph and the current implementation; it makes no general readability or convergence claim.</p></figcaption></figure>
</main><script>
const slides=[...document.querySelectorAll('figure')],previous=document.querySelector('#previous'),next=document.querySelector('#next');let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>slide.hidden=i!==current);previous.disabled=current===0;next.disabled=current===slides.length-1;document.querySelector('#position').textContent=(current+1)+' / '+slides.length;history.replaceState(null,'','#'+slides[current].id);}
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',event=>{const index=event.key==='ArrowLeft'?current-1:event.key==='ArrowRight'?current+1:event.key==='Home'?0:event.key==='End'?slides.length-1:null;if(index!==null&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey){event.preventDefault();show(index);}});
window.addEventListener('hashchange',()=>show(slides.findIndex(slide=>slide.id===location.hash.slice(1))));show(Math.max(0,slides.findIndex(slide=>slide.id===location.hash.slice(1))));
</script></body></html>
