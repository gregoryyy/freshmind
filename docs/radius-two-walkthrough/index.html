<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshmind 4 radius-two exploration</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f0;color:#263e33}header,main{max-width:1440px;margin:auto;padding:16px}h1{font-size:22px;margin:0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:5px 14px;cursor:pointer}button:disabled{cursor:default}figure{margin:0 0 30px}figure[hidden]{display:none}img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border:1px solid #c4cdbf}h2{font-size:18px}a{color:inherit}nav[aria-label="Walkthrough chapters"] a{padding:4px 9px;border:1px solid #c4cdbf;border-radius:4px;text-decoration:none}nav a[aria-current]{background:#dbe9df;font-weight:650}.chapter{margin:0;color:#526b5d;font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #6cb08b;outline-offset:3px}</style></head>
<body><header><h1>Freshmind 4 radius-two exploration</h1><nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next" type="button">Next</button><a href="README.md">Markdown walkthrough</a></nav></header><main>
<figure id="overview"><h2>1. A radius-two neighborhood without drawn links</h2><img src="01-overview.png" width="1440" height="1000" alt="A radius-two neighborhood without drawn links"><figcaption><p>Workspace has three direct neighbors on the vertical spine and two unique second-hop nodes across four occurrences. Incoming and outgoing wings retain real direction. The six-node, thirteen-relation graph includes loops, a reciprocal pair, cross-links and a zero-weight parallel relation. Selection and History remain hidden in the force view; this mode explicitly inspects the complete stored graph.</p></figcaption></figure>
<figure id="sharing"><h2>2. Shared identity and exact relation records</h2><img src="02-sharing.png" width="1440" height="1000" alt="Shared identity and exact relation records"><figcaption><p>Selection appears in three cells bound to one canonical node. Selecting or focusing one occurrence highlights its siblings and witness rows. Expanded records retain both parallel relations, including weight zero, and name the actual endpoints. Inspecting a hidden node changes selection without revealing it in the original force locality.</p></figcaption></figure>
<figure id="search-seed"><h2>3. Enter a neighborhood from an accepted search result</h2><img src="03-search-seed.png" width="1440" height="1000" alt="Enter a neighborhood from an accepted search result"><figcaption><p>A real local lexical query for Selection creates the ordinary query/result records. The accepted result becomes the radius-two center and selected node, with its source, rank, raw score and corpus provenance retained. Seeding adds no further graph records and does not change positions or force-view visibility. LDA seeding uses the same adapter and is covered by real-worker browser checks.</p></figcaption></figure>
</main><script>
const slides=[...document.querySelectorAll('figure')],previous=document.querySelector('#previous'),next=document.querySelector('#next');let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>slide.hidden=i!==current);previous.disabled=current===0;next.disabled=current===slides.length-1;document.querySelector('#position').textContent=(current+1)+' / '+slides.length;for(const link of document.querySelectorAll('nav [data-chapter]')){if(link.dataset.chapter===slides[current].dataset.chapter)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');}history.replaceState(null,'','#'+slides[current].id);}
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',event=>{const index=event.key==='ArrowLeft'?current-1:event.key==='ArrowRight'?current+1:event.key==='Home'?0:event.key==='End'?slides.length-1:null;if(index!==null&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey){event.preventDefault();show(index);}});
window.addEventListener('hashchange',()=>show(slides.findIndex(slide=>slide.id===location.hash.slice(1))));show(Math.max(0,slides.findIndex(slide=>slide.id===location.hash.slice(1))));
</script></body></html>
