data: {}
extensions: {}
substructures:
  - id: weighted-tree
    label: Weighted tree
    kind: tree
    rootId: root
    nodeIds:
      - root
      - a
      - b
      - c
      - a1
      - a2
      - b1
    edgeIds:
      - ra
      - rb
      - rc
      - aa1
      - aa2
      - bb1
view:
  focus: root
  wholeGraph: true
  radius: 3
  lenses:
    zoom: 1
    hyperbolic: 0
    rotation: 0
  canvas:
    zoom: 1
