  nodeVisuals:
    default:
      shape: rectangle
      fill: "#a03000"
      text:
        color: "#ffffff"
        font: bold 13px Arial, sans-serif
      stroke:
        color: "#000000"
        width: 1
        dash: solid
      label:
        maxWidth: 150
        paddingX: 8
        paddingY: 4
      halo:
        enabled: true
        opacity: 0.3
      states:
        fixed:
          fill: "#0000ff"
        selected:
          fill: "#ffff00"
          text:
            color: "#171717"
        hover:
          fill: "#ffff00"
          text:
            color: "#171717"
        preselected:
          fill: "#ff9000"
          text:
            color: "#171717"
        activeCandidate:
          stroke:
            color: "#183b2b"
            width: 3
    paper:
      extends: default
      shape: double-trapezoid-vertical
      states:
        fixed:
          fill: "#00ffff"
          text:
            color: "#171717"
    person:
      extends: default
      shape: rounded-rectangle
      fill: "#30a000"
      text:
        color: "#171717"
      states:
        fixed:
          fill: "#00ffff"
          text:
            color: "#171717"
    idea:
      extends: default
      shape: double-trapezoid-horizontal
      fill: "#0030a0"
      states:
        fixed:
          fill: "#ff00ff"
          text:
            color: "#171717"
    task:
      extends: default
      shape: inverted-trapezoid
      fill: "#303000"
      states:
        fixed:
          fill: "#00ff00"
          text:
            color: "#171717"
    topic:
      extends: default
      shape: rounded-rectangle
      states:
        fixed:
          fill: "#888888"
          text:
            color: "#171717"
    project:
      extends: default
      shape: rounded-rectangle
    software:
      extends: default
      shape: parallelogram-right
      states:
        fixed:
          fill: "#00ffff"
          text:
            color: "#171717"
    query:
      extends: default
      shape: ellipse
      fill: "#00ff00"
      text:
        color: "#0000ff"
      states:
        fixed:
          fill: "#00ff00"
    simplequery:
      extends: query
      stroke:
        dash: dashed
    lucenequery:
      extends: query
      stroke:
        dash: long-dashed
    ldaquery:
      extends: query
      stroke:
        dash: dash-dotted
    group:
      extends: default
      shape: ellipse
      fill: "#88ff88"
      text:
        color: "#222288"
      states:
        fixed:
          fill: "#88ff88"
        selected:
          fill: "#ffff88"
        hover:
          fill: "#ffff88"
    event:
      extends: query
      stroke:
        dash: solid
    presentation:
      extends: query
      shape: double-trapezoid-vertical
    concept:
      extends: query
      shape: parallelogram-right
    annot:
      extends: query
      shape: parallelogram-left
    decision:
      extends: query
      shape: convex-rectangle
    proposal:
      extends: query
      shape: inverted-trapezoid
    question:
      extends: query
      shape: trapezoid
    location:
      extends: query
      shape: convex-rectangle
    time:
      extends: query
      shape: concave-rectangle
  edgeVisuals:
    default:
      curve: spider
      stroke:
        color: "#0000b0"
        width: 1
        dash: solid
      arrow:
        placement: middle
        size: 5
      label:
