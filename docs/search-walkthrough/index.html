<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshmind 4 graph search walkthrough</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f0;color:#263e33}header,main{max-width:1440px;margin:auto;padding:16px}h1{font-size:22px;margin:0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:5px 14px;cursor:pointer}button:disabled{cursor:default}figure{margin:0 0 30px}figure[hidden]{display:none}img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border:1px solid #c4cdbf}h2{font-size:18px}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #6cb08b;outline-offset:3px}</style></head>
<body><header><h1>Freshmind 4 graph search walkthrough</h1><nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next" type="button">Next</button><a href="README.md">Markdown walkthrough</a></nav></header><main>
<figure id="library"><h2>1. A searchable research library</h2><img src="01-library.png" width="1440" height="1000" alt="A searchable research library"><figcaption><p>This new fictional graph contains 24 nodes and 28 semantic relations: three researchers, eighteen papers, two bridge papers and a collection. Labels, annotations and exact tags are searchable, including currently hidden items. RFC and the viewing lens remain independent controls.</p></figcaption></figure>
<figure id="lexical-query"><h2>2. A term query joins its context</h2><img src="02-lexical-query.png" width="1440" height="1000" alt="A term query joins its context"><figcaption><p>An elasticlunr literal query for spring layout is attached to Mira Vega as context. Green relations carry ranked relevance; existing authored and citation relations remain. The query node can be selected and rerun without duplicating it.</p></figcaption></figure>
<figure id="exact-tags"><h2>3. Whole-tag retrieval</h2><img src="03-exact-tags.png" width="1440" height="1000" alt="Whole-tag retrieval"><figcaption><p>The same query node now retrieves exact visual search tags. Tags are explicit metadata and work without topic training. The query replaces its earlier result links while retaining context and manual semantic relations.</p></figcaption></figure>
<figure id="topic-model"><h2>4. Train and inspect topics</h2><img src="04-topic-model.png" width="1440" height="1000" alt="Train and inspect topics"><figcaption><p>Three topics are trained locally for 200 serial Gibbs passes with seed 4357, alpha 0.1, beta 0.01 and minimum document frequency 2. Separate local JSON files can save/reload the model and its corpus. The most probable words make the fitted topics inspectable. This deliberately separated synthetic corpus does not establish general retrieval quality.</p></figcaption></figure>
<figure id="topical-query"><h2>5. Retrieve by inferred topics</h2><img src="05-topical-query.png" width="1440" height="1000" alt="Retrieve by inferred topics"><figcaption><p>The text query geometry repulsion is folded into the fixed topic model. Document topic distributions determine symmetric KL distance in bits, with a strict default distance limit of 0.6. Raw distances are labeled; lower values are better. Switching the selected query to LDA replaces its prior links and updates its query type; scores are separate from node importance and RFC physics.</p></figcaption></figure>
<figure id="node-similarity"><h2>6. Use an existing paper as the query</h2><img src="06-node-similarity.png" width="1440" height="1000" alt="Use an existing paper as the query"><figcaption><p>Spring neighborhoods retrieves similar graph items directly from its own topic mixture, excluding itself. Existing authored/citation relations remain. The result links expand ordinary graph browsing without requiring a separate results page.</p></figcaption></figure>
<figure id="rejected-result"><h2>7. Retain a negative judgment</h2><img src="07-rejected-result.png" width="1440" height="1000" alt="Retain a negative judgment"><figcaption><p>Rejecting a selected green result relation removes that link and saves its source, target, query, engine and corpus provenance. Repeating the same query omits that item. Native YAML saves queries, remaining links and feedback; model JSON is saved separately through the training controls. Feedback learning remains future work.</p></figcaption></figure>
</main><script>
const slides=[...document.querySelectorAll('figure')],previous=document.querySelector('#previous'),next=document.querySelector('#next');let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>slide.hidden=i!==current);previous.disabled=current===0;next.disabled=current===slides.length-1;document.querySelector('#position').textContent=(current+1)+' / '+slides.length;history.replaceState(null,'','#'+slides[current].id);}
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',event=>{const index=event.key==='ArrowLeft'?current-1:event.key==='ArrowRight'?current+1:event.key==='Home'?0:event.key==='End'?slides.length-1:null;if(index!==null&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey){event.preventDefault();show(index);}});
window.addEventListener('hashchange',()=>show(slides.findIndex(slide=>slide.id===location.hash.slice(1))));show(Math.max(0,slides.findIndex(slide=>slide.id===location.hash.slice(1))));
</script></body></html>
