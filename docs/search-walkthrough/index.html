<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshmind 4 graph search walkthrough</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f0;color:#263e33}header,main{max-width:1440px;margin:auto;padding:16px}h1{font-size:22px;margin:0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:5px 14px;cursor:pointer}button:disabled{cursor:default}figure{margin:0 0 30px}figure[hidden]{display:none}img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;border:1px solid #c4cdbf}h2{font-size:18px}a{color:inherit}nav[aria-label="Walkthrough chapters"] a{padding:4px 9px;border:1px solid #c4cdbf;border-radius:4px;text-decoration:none}nav a[aria-current]{background:#dbe9df;font-weight:650}.chapter{margin:0;color:#526b5d;font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #6cb08b;outline-offset:3px}</style></head>
<body><header><h1>Freshmind 4 graph search walkthrough</h1><nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><span id="position" role="status" aria-live="polite"></span><button id="next" type="button">Next</button><a href="README.md">Markdown walkthrough</a></nav></header><main>
<figure id="library"><h2>1. A searchable research library</h2><img src="01-library.png" width="1440" height="1000" alt="A searchable research library"><figcaption><p>This new fictional graph contains 24 nodes and 28 semantic relations: three researchers, eighteen papers, two bridge papers and a collection. Labels, annotations and exact tags are searchable, including currently hidden items. RFC and the viewing lens remain independent controls.</p></figcaption></figure>
<figure id="query-draft"><h2>2. Start a search directly on the graph</h2><img src="02-query-draft.png" width="1440" height="1000" alt="Start a search directly on the graph"><figcaption><p>Select Mira Vega and press Ctrl+F. A query node appears immediately, linked to Mira as context, with its text editor on the graph. Type spring layout and press Enter to retrieve. The empty draft is excluded from the search corpus; ordinary typing and text deletion keep their normal meaning.</p></figcaption></figure>
<figure id="lexical-query"><h2>3. A term query joins its context</h2><img src="03-lexical-query.png" width="1440" height="1000" alt="A term query joins its context"><figcaption><p>Enter runs the elasticlunr literal query for spring layout. The radius-two neighborhood shows ranked matches and their ordinary context; other content stays stored and searchable. Green relations carry ranked relevance alongside authored/citation links. F2 edits and reruns the query without duplicating it; the sidebar offers the same search controls.</p></figcaption></figure>
<figure id="exact-tags"><h2>4. Whole-tag retrieval</h2><img src="04-exact-tags.png" width="1440" height="1000" alt="Whole-tag retrieval"><figcaption><p>The same query node now retrieves exact visual search tags. Tags are explicit metadata and work without topic training. The query replaces its earlier result links while retaining context and manual semantic relations.</p></figcaption></figure>
<figure id="topic-model"><h2>5. Train and inspect topics</h2><img src="05-topic-model.png" width="1440" height="1000" alt="Train and inspect topics"><figcaption><p>Three topics are trained locally for 200 serial Gibbs passes with seed 4357, alpha 0.1, beta 0.01 and minimum document frequency 2. Separate local JSON files can save/reload the model and its corpus. The most probable words make the fitted topics inspectable. This deliberately separated synthetic corpus does not establish general retrieval quality.</p></figcaption></figure>
<figure id="topical-query"><h2>6. Retrieve by inferred topics</h2><img src="06-topical-query.png" width="1440" height="1000" alt="Retrieve by inferred topics"><figcaption><p>Ctrl+Shift+F starts a separate LDA query on the graph. Enter submits geometry repulsion to the trained topic model. Symmetric KL distance in bits ranks document topic mixtures, with a strict default limit of 0.6; lower distances are better. The earlier tag query remains available. Search scores stay separate from importance and RFC physics.</p></figcaption></figure>
<figure id="node-similarity"><h2>7. Use an existing paper as the query</h2><img src="07-node-similarity.png" width="1440" height="1000" alt="Use an existing paper as the query"><figcaption><p>Select Spring neighborhoods and press Ctrl+Shift+R to retrieve similar items from its topic mixture, excluding itself. Ctrl+R provides literal similarity. Existing authored/citation relations remain. Results expand ordinary graph browsing without requiring a separate results page.</p></figcaption></figure>
<figure id="rejected-result"><h2>8. Retain a negative judgment</h2><img src="08-rejected-result.png" width="1440" height="1000" alt="Retain a negative judgment"><figcaption><p>Rejecting a selected green result relation removes that link and saves its source, target, query, engine and corpus provenance. Repeating the same query omits that item. Native YAML saves queries, remaining links and feedback; model JSON is saved separately through the training controls. Feedback learning remains future work.</p></figcaption></figure>
<figure id="delete-query"><h2>9. Remove a query and keep the source graph</h2><img src="09-delete-query.png" width="1440" height="1000" alt="Remove a query and keep the source graph"><figcaption><p>Select the LDA text-query node and press Ctrl+Backspace (or Ctrl+Delete) while graph focus is active. Only that query and its incident associations disappear; retrieved papers, original semantic relations, the earlier tag query and the paper-based similarity search remain. Native YAML can retain the queries and rejection judgments you choose to keep.</p></figcaption></figure>
</main><script>
const slides=[...document.querySelectorAll('figure')],previous=document.querySelector('#previous'),next=document.querySelector('#next');let current=0;
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((slide,i)=>slide.hidden=i!==current);previous.disabled=current===0;next.disabled=current===slides.length-1;document.querySelector('#position').textContent=(current+1)+' / '+slides.length;for(const link of document.querySelectorAll('nav [data-chapter]')){if(link.dataset.chapter===slides[current].dataset.chapter)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');}history.replaceState(null,'','#'+slides[current].id);}
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',event=>{const index=event.key==='ArrowLeft'?current-1:event.key==='ArrowRight'?current+1:event.key==='Home'?0:event.key==='End'?slides.length-1:null;if(index!==null&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey){event.preventDefault();show(index);}});
window.addEventListener('hashchange',()=>show(slides.findIndex(slide=>slide.id===location.hash.slice(1))));show(Math.max(0,slides.findIndex(slide=>slide.id===location.hash.slice(1))));
</script></body></html>
