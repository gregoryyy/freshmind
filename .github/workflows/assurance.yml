name: Assurance delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies and browser
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Sequential checks and repeated-build evidence
        run: node scripts/assurance-delivery.mjs "$RUNNER_TEMP/fm4-assurance"
        env:
          ASSURANCE_BROWSER_REPORT: ${{ runner.temp }}/fm4-assurance/privacy-browser.json
      - name: Retain scoped evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fm4-assurance
          retention-days: 14
          if-no-files-found: warn
